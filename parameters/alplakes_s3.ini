[General]
remote_dias_api=COAH,CREODIAS
start=2024-09-15T00:00:00.000Z
end=2024-09-15T23:59:59.999Z
sensor=OLCI
resolution=300
wkt_name=alpinespace
wkt=
mosaic=False
processors=IDEPIX,RADCOR,POLYMER,COMBINE,OC3,SECCHIDEPTH,PRIMARYPRODUCTION,FORELULE
adapters=GEOTIFF
remove_inputs=True
remove_outputs=True

[RADCOR]
radcor_kernel_radius=2
limit_buffer=2
limit_buffer_units=km
radcor_max_vza=60
radcor_crop_centre=True
radcor_aot_estimate=tsdsf
dsf_aot_estimate=fixed
dsf_interface_reflectance=False
radcor_edge_extend=False
luts=ACOLITE-LUT-202110-MOD1

[POLYMER]
ancillary=NASA
water_model=PR05
validexpression=
vicar_version=olci_scv2019

[COMBINE]
idepix=pixel_classif_flags
polymer=ALL
validexpression=pixel_classif_flags == 0 and vza <= 25 and bitmask == 0 and Rw865 >= -0.001 and Rw1020 < 0.05 and Rw1020 > -0.05

[OC3]
processor=COMBINE
validexpression=max(Rw443,Rw490)>0.006

[SECCHIDEPTH]
chunks=32
processor=COMBINE
m0=0.0
m1=5.8

[PRIMARYPRODUCTION]
chl_parameter=CHL
chl_processor=OC3
chl_bandname=chla
kd_processor=SECCHIDEPTH
kd_bandname=Zsd_lee

[FORELULE]
processor=COMBINE

[GEOTIFF]
upload=true
overwrite=true
bucket=eawagrs
bucket_path=production/sentinel3
upload_netcdf = false
lake_mask=shallow_300
combine_bands=tsm_binding754[0:1000]
oc3_bands=chla[0:1000]
secchidepth_bands=Zsd_lee[0:25]
primaryproduction_bands=pp_integral[0:10000]
forelule_bands=forel_ule[0:22]
